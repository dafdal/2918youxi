<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜数字大师 - 2918.io</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 50% 0%,#1a3a2a,#0a0e1a);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}header{width:100%;padding:14px 20px;background:rgba(17,24,39,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}header a{color:#ff6600;text-decoration:none;font-size:14px}header h1{font-size:18px}#game{margin:20px auto;display:block;border-radius:16px;box-shadow:0 20px 60px rgba(34,170,102,.3),inset 0 0 40px rgba(34,170,102,.1);border:1px solid rgba(34,170,102,.3)}#info{margin:10px;font-size:18px;color:#bfeaff;text-shadow:0 0 10px rgba(34,230,255,.5);padding:10px 20px;background:rgba(34,170,102,.1);border-radius:8px;border:1px solid rgba(34,170,102,.3)}#guessInput{padding:12px 16px;border:2px solid rgba(34,170,102,.5);border-radius:10px;background:rgba(10,14,26,.8);color:#fff;font-size:18px;width:120px;text-align:center;outline:none}#guessInput:focus{border-color:#21e6ff;box-shadow:0 0 15px rgba(33,230,255,.4)}.controls{margin:15px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}button{padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6600,#ff8833);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(255,102,0,.4);transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,102,0,.6)}button:active{transform:translateY(0)}footer{margin-top:auto;padding:20px;width:100%;text-align:center;background:rgba(17,24,39,.8);color:#666;font-size:13px}footer b{color:#ff6600}</style></head><body><header><a href="index.html">← 返回</a><h1>猜数字大师</h1><a href="index.html">2918.io</a></header><canvas id="game" width="480" height="400"></canvas><div id="info">我想好了一个1-100的数字，猜猜是几？</div><input type="number" id="guessInput" min="1" max="100" placeholder="1-100"><div class="controls"><button onclick="doGuess()">猜！</button><button onclick="restart()">重新开始</button></div><footer>© 2026 <b>大风大浪集团</b> 版权所有 · 2918.io</footer><script>var n=Math.floor(Math.random()*100)+1,tries=0,low=1,high=100;var c=document.getElementById('game'),x=c.getContext('2d');var hist=[];function doGuess(){var v=parseInt(document.getElementById('guessInput').value);if(!v||v<1||v>100){document.getElementById('info').textContent='请输入1-100之间的数字！';return;}tries++;hist.push(v);var info=document.getElementById('info');if(v===n){info.textContent='恭喜！猜中了！答案是'+n+'，用了'+tries+'次！';confetti();}else if(v<n){info.textContent='第'+tries+'次: '+v+' 太小了！往大了猜';low=Math.max(low,v);}else{info.textContent='第'+tries+'次: '+v+' 太大了！往小了猜';high=Math.min(high,v);}document.getElementById('guessInput').value='';draw();}document.getElementById('guessInput').addEventListener('keydown',function(e){if(e.key==='Enter')doGuess();});function draw(){x.fillStyle='#0a0e1a';x.fillRect(0,0,480,400);var grad=x.createLinearGradient(0,0,480,400);grad.addColorStop(0,'#0a1a0f');grad.addColorStop(1,'#0a0e1a');x.fillStyle=grad;x.fillRect(0,0,480,400);x.strokeStyle='rgba(34,170,102,.3)';x.lineWidth=2;x.strokeRect(20,20,440,360);x.fillStyle='#22aa66';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('猜数字游戏',240,60);x.fillStyle='#8ea3c9';x.font='16px sans-serif';x.fillText('范围: '+low+' ~ '+high,240,100);x.fillStyle='#ff6600';x.font='bold 22px sans-serif';x.fillText('已猜次数: '+tries,240,140);x.strokeStyle='rgba(255,102,0,.2)';x.beginPath();x.moveTo(40,170);x.lineTo(440,170);x.stroke();x.fillStyle='#8ea3c9';x.font='14px sans-serif';x.fillText('历史猜测:',240,195);hist.forEach(function(v,i){var y=225+i*30;if(i>=5)return;x.fillStyle=v<n?'#4488ff':v>n?'#ff4444':'#44ff44';x.beginPath();x.arc(60,y,8,0,7);x.fill();x.fillStyle='#fff';x.textAlign='left';x.font='16px sans-serif';x.fillText(v+(v<n?' 太小':v>n?' 太大':' 对了'),80,y+5);});x.textAlign='center';}function confetti(){for(var i=0;i<50;i++){var p=document.createElement('div');p.style.cssText='position:fixed;width:8px;height:8px;background:hsl('+Math.random()*360+',70%,60%);left:50%;top:50%;pointer-events:none;border-radius:50%;z-index:9999;';document.body.appendChild(p);var angle=Math.random()*Math.PI*2,d=Math.random()*200+100;var start=performance.now();function anim(now){var t=(now-start)/1000;if(t>2){p.remove();return;}p.style.transform='translate('+Math.cos(angle)*d*t+'px,'+Math.sin(angle)*d*t-200*t*t+'px)';p.style.opacity=1-t/2;requestAnimationFrame(anim);}requestAnimationFrame(anim);}}function restart(){n=Math.floor(Math.random()*100)+1;tries=0;low=1;high=100;hist=[];document.getElementById('info').textContent='我想好了一个1-100的数字，猜猜是几？';draw();}draw();</script></body></html>
