<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>熔岩逃生 - 2918.io</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 50% 0%,#151a2e,#0a0e1a);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}header{width:100%;padding:14px 20px;background:rgba(17,24,39,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}header a{color:#ff6600;text-decoration:none;font-size:14px}header h1{font-size:18px;color:#fff}#game{margin:20px auto;display:block;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px #bb223366}#info{margin:10px;font-size:16px;color:#ccc}.controls{margin:10px;display:flex;gap:10px}button{padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6600,#ff8833);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(255,102,0,.4);transition:.2s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(0)}button:hover{background:#ff8833}footer{margin-top:auto;padding:20px;width:100%;text-align:center;background:rgba(17,24,39,.8);color:#666;font-size:13px}footer b{color:#ff6600}</style>
<style>#game{max-width:100%;height:auto;}</style>
</head><body><header><a href="index.html">← 返回游戏列表</a><h1>熔岩逃生</h1><a href="index.html">2918.io</a></header><canvas id="game" width="480" height="600"></canvas><div id="info">分数: 0</div><div class="controls"><button onclick="restart()">重新开始</button></div><footer>© 2026 <b>大风大浪集团</b> 版权所有 · 2918.io</footer><script>
var g={px:200,obstacles:[],score:0,loop:null};
var c=document.getElementById('game'),x=c.getContext('2d');
c.width=400;c.height=500;
c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();g.px=(e.clientX-r.left)*(400/r.width);});
function spawn(){g.obstacles.push({x:Math.random()*380,y:-20,speed:2+Math.random()*3});}
function step(){
  x.fillStyle='#0a0e1a';x.fillRect(0,0,400,500);
  for(var i=g.obstacles.length-1;i>=0;i--){
    g.obstacles[i].y+=g.obstacles[i].speed;
    x.fillStyle='#ff4444';x.beginPath();x.arc(g.obstacles[i].x,g.obstacles[i].y,12,0,7);x.fill();
    if(g.obstacles[i].y>520)g.obstacles.splice(i,1);
    if(g.obstacles[i]&&Math.abs(g.obstacles[i].x-g.px)<20&&Math.abs(g.obstacles[i].y-470)<20){
      document.getElementById('info').textContent='游戏结束! 分数: '+g.score;
      clearInterval(g.loop);return;
    }
  }
  g.score++;
  x.fillStyle='#44ff44';x.beginPath();x.arc(g.px,470,12,0,7);x.fill();
  document.getElementById('info').textContent='分数: '+g.score;
  if(Math.random()<0.05)spawn();
  requestAnimationFrame(step);
}
function restart(){g.obstacles=[];g.score=0;document.getElementById('info').textContent='分数: 0';clearInterval(g.loop);g.loop=setInterval(step,16);}
g.loop=setInterval(step,16);

/* ===== 触屏支持 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  function touchPos(t){
    var r=c.getBoundingClientRect();
    return {clientX:t.clientX,clientY:t.clientY};
  }
  c.addEventListener('touchstart',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  c.addEventListener('touchmove',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  document.addEventListener('touchstart',function(e){
    if(e.target.tagName==='BUTTON')return;
  });
})();

/* ===== 触屏滑动模拟方向键 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  var sx=0,sy=0;
  c.addEventListener('touchstart',function(e){
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  c.addEventListener('touchend',function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;
    var key=null;
    if(Math.abs(dx)>Math.abs(dy)){
      key=dx>30?'ArrowRight':dx<-30?'ArrowLeft':null;
    }else{
      key=dy>30?'ArrowDown':dy<-30?'ArrowUp':null;
    }
    if(key){
      document.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true}));
    }
  },{passive:true});
})();
</script></body></html>
