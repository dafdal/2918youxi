<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深海射击 - 2918.io</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 50% 0%,#151a2e,#0a0e1a);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}header{width:100%;padding:14px 20px;background:rgba(17,24,39,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}header a{color:#ff6600;text-decoration:none;font-size:14px}header h1{font-size:18px;color:#fff}#game{margin:20px auto;display:block;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px #22558866}#info{margin:10px;font-size:16px;color:#ccc}.controls{margin:10px;display:flex;gap:10px}button{padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6600,#ff8833);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(255,102,0,.4);transition:.2s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(0)}button:hover{background:#ff8833}footer{margin-top:auto;padding:20px;width:100%;text-align:center;background:rgba(17,24,39,.8);color:#666;font-size:13px}footer b{color:#ff6600}</style>
<style>#game{max-width:100%;height:auto;}</style>
</head><body><header><a href="index.html">← 返回游戏列表</a><h1>深海射击</h1><a href="index.html">2918.io</a></header><canvas id="game" width="480" height="600"></canvas><div id="info">分数: 0</div><div class="controls"><button onclick="restart()">重新开始</button></div><footer>© 2026 <b>大风大浪集团</b> 版权所有 · 2918.io</footer><script>
var g={px:200,bullets:[],enemies:[],score:0,loop:null};
var c=document.getElementById('game'),x=c.getContext('2d');
c.width=400;c.height=500;
c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();g.px=(e.clientX-r.left)*(400/r.width);});
c.addEventListener('click',function(){g.bullets.push({x:g.px,y:480});});
function step(){
  x.fillStyle='#000';x.fillRect(0,0,400,500);
  if(Math.random()<0.02)g.enemies.push({x:Math.random()*380,y:0,speed:1+Math.random()*2});
  for(var i=g.bullets.length-1;i>=0;i--){g.bullets[i].y-=5;if(g.bullets[i].y<0)g.bullets.splice(i,1);}
  for(var i=g.enemies.length-1;i>=0;i--){
    g.enemies[i].y+=g.enemies[i].speed;
    if(g.enemies[i].y>520)g.enemies.splice(i,1);
    for(var j=g.bullets.length-1;j>=0;j--){
      if(Math.abs(g.enemies[i].x-g.bullets[j].x)<15&&Math.abs(g.enemies[i].y-g.bullets[j].y)<15){
        g.enemies.splice(i,1);g.bullets.splice(j,1);g.score+=10;
        document.getElementById('info').textContent='分数: '+g.score;
      }
    }
  }
  x.fillStyle='#ff4444';
  g.enemies.forEach(function(e){x.beginPath();x.arc(e.x,e.y,12,0,7);x.fill();});
  x.fillStyle='#ffff44';
  g.bullets.forEach(function(b){x.fillRect(b.x-2,b.y,4,10);});
  x.fillStyle='#4488ff';x.fillRect(g.px-20,480,40,20);
  requestAnimationFrame(step);
}
function restart(){g.bullets=[];g.enemies=[];g.score=0;document.getElementById('info').textContent='分数: 0';}
step();

/* ===== 触屏支持 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  function touchPos(t){
    var r=c.getBoundingClientRect();
    return {clientX:t.clientX,clientY:t.clientY};
  }
  c.addEventListener('touchstart',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  c.addEventListener('touchmove',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  document.addEventListener('touchstart',function(e){
    if(e.target.tagName==='BUTTON')return;
  });
})();

/* ===== 触屏滑动模拟方向键 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  var sx=0,sy=0;
  c.addEventListener('touchstart',function(e){
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  c.addEventListener('touchend',function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;
    var key=null;
    if(Math.abs(dx)>Math.abs(dy)){
      key=dx>30?'ArrowRight':dx<-30?'ArrowLeft':null;
    }else{
      key=dy>30?'ArrowDown':dy<-30?'ArrowUp':null;
    }
    if(key){
      document.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true}));
    }
  },{passive:true});
})();
</script></body></html>
