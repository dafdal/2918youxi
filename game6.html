<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双人五子棋 - 2918.io</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 50% 0%,#151a2e,#0a0e1a);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}header{width:100%;padding:14px 20px;background:rgba(17,24,39,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}header a{color:#ff6600;text-decoration:none;font-size:14px}header h1{font-size:18px;color:#fff}#game{margin:20px auto;display:block;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px #9944dd66}#info{margin:10px;font-size:16px;color:#ccc}.controls{margin:10px;display:flex;gap:10px}button{padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6600,#ff8833);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(255,102,0,.4);transition:.2s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(0)}button:hover{background:#ff8833}footer{margin-top:auto;padding:20px;width:100%;text-align:center;background:rgba(17,24,39,.8);color:#666;font-size:13px}footer b{color:#ff6600}</style>
<style>#game{max-width:100%;height:auto;}</style>
</head><body><header><a href="index.html">← 返回游戏列表</a><h1>双人五子棋</h1><a href="index.html">2918.io</a></header><canvas id="game" width="480" height="600"></canvas><div id="info">分数: 0</div><div class="controls"><button onclick="restart()">重新开始</button></div><footer>© 2026 <b>大风大浪集团</b> 版权所有 · 2918.io</footer><script>
var g={board:[],player:1,gameOver:false};
var c=document.getElementById('game'),x=c.getContext('2d');
c.width=400;c.height=400;
for(var i=0;i<225;i++)g.board.push(0);
c.addEventListener('click',function(e){
  if(g.gameOver)return;
  var r=c.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(400/r.width),my=(e.clientY-r.top)*(400/r.height);
  var col=Math.floor(mx/40),row=Math.floor(my/40);
  var idx=row*15+col;
  if(g.board[idx]!==0)return;
  g.board[idx]=g.player;
  if(checkWin(g.player)){document.getElementById('info').textContent=(g.player===1?'黑':'白')+'棋赢了!';g.gameOver=true;return;}
  g.player=g.player===1?2:1;
  if(g.player===2){
    var best=-1;while(best<0||g.board[best]!==0)best=Math.floor(Math.random()*225);
    g.board[best]=2;
    if(checkWin(2)){document.getElementById('info').textContent='白棋赢了!';g.gameOver=true;return;}
    g.player=1;
  }
  draw();
});
function checkWin(p){
  for(var r=0;r<15;r++)for(var col=0;col<15;col++){
    var i=r*15+col;
    if(g.board[i]!==p)continue;
    if(col<11&&g.board[i+1]===p&&g.board[i+2]===p&&g.board[i+3]===p&&g.board[i+4]===p)return true;
    if(r<11&&g.board[i+15]===p&&g.board[i+30]===p&&g.board[i+45]===p&&g.board[i+60]===p)return true;
    if(col<11&&r<11&&g.board[i+16]===p&&g.board[i+32]===p&&g.board[i+48]===p&&g.board[i+64]===p)return true;
  }
  return false;
}
function draw(){
  x.fillStyle='#dda';x.fillRect(0,0,400,400);
  x.strokeStyle='#888';
  for(var i=0;i<=15;i++){x.beginPath();x.moveTo(i*40,0);x.lineTo(i*40,400);x.stroke();x.beginPath();x.moveTo(0,i*40);x.lineTo(400,i*40);x.stroke();}
  for(var r=0;r<15;r++)for(var col=0;col<15;col++){
    if(g.board[r*15+col]){x.beginPath();x.arc(col*40,r*40,15,0,7);x.fillStyle=g.board[r*15+col]===1?'#000':'#fff';x.fill();}
  }
}
function restart(){g.board=[];for(var i=0;i<225;i++)g.board.push(0);g.player=1;g.gameOver=false;document.getElementById('info').textContent='黑棋先手';draw();}
draw();

/* ===== 触屏支持 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  function touchPos(t){
    var r=c.getBoundingClientRect();
    return {clientX:t.clientX,clientY:t.clientY};
  }
  c.addEventListener('touchstart',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  c.addEventListener('touchmove',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var ev=new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY,bubbles:true});
    c.dispatchEvent(ev);
  },{passive:false});
  document.addEventListener('touchstart',function(e){
    if(e.target.tagName==='BUTTON')return;
  });
})();

/* ===== 触屏滑动模拟方向键 ===== */
(function(){
  var c=document.getElementById('game');
  if(!c)return;
  var sx=0,sy=0;
  c.addEventListener('touchstart',function(e){
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  c.addEventListener('touchend',function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;
    var key=null;
    if(Math.abs(dx)>Math.abs(dy)){
      key=dx>30?'ArrowRight':dx<-30?'ArrowLeft':null;
    }else{
      key=dy>30?'ArrowDown':dy<-30?'ArrowUp':null;
    }
    if(key){
      document.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true}));
    }
  },{passive:true});
})();
</script></body></html>
